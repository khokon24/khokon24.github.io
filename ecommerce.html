<!DOCTYPE html>
<html>
<head>
<title>Ecommerce Pro | KhokonWeb</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:Poppins;
background:#0a0a0a;
color:white;
}

header{
padding:25px;
text-align:center;
background:#111;
color:#00f5ff;
font-size:24px;
font-weight:bold;
}

.grid{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:20px;
padding:40px;
}

.product{
background:rgba(255,255,255,0.05);
width:220px;
padding:15px;
border-radius:15px;
transition:.3s;
}

.product:hover{
transform:scale(1.05);
box-shadow:0 0 25px #00f5ff;
}

img{
width:100%;
border-radius:10px;
}

.price{
color:#00f5ff;
font-weight:bold;
}

button{
margin-top:10px;
padding:10px;
width:100%;
border:none;
border-radius:20px;
background:#00f5ff;
font-weight:bold;
cursor:pointer;
}
</style>
</head>

<body>

<header>🛒 Premium Ecommerce UI Demo</header>

<div class="grid">

<div class="product">
<img src="https://via.placeholder.com/220">
<h3>Smart Watch</h3>
<p class="price">$49</p>
<button>Buy Now</button>
</div>

<div class="product">
<img src="https://via.placeholder.com/220">
<h3>Headphones</h3>
<p class="price">$79</p>
<button>Buy Now</button>
</div>

<div class="product">
<img src="https://via.placeholder.com/220">
<h3>Shoes</h3>
<p class="price">$99</p>
<button>Buy Now</button>
</div>

</div>

</body>
</html>

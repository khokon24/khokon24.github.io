<!DOCTYPE html>
<html>
<head>
<title>Ecommerce Demo | KhokonWeb</title>
<style>
body{
margin:0;
font-family:Poppins;
background:#0a0a0a;
color:white;
}

header{
padding:20px;
background:#111;
text-align:center;
color:#00f5ff;
font-size:22px;
font-weight:bold;
}

.container{
display:flex;
flex-wrap:wrap;
justify-content:center;
padding:30px;
gap:20px;
}

.card{
background:rgba(255,255,255,0.05);
padding:15px;
border-radius:10px;
width:220px;
text-align:center;
transition:.3s;
}

.card:hover{
transform:scale(1.05);
box-shadow:0 0 20px #00f5ff;
}

img{
width:100%;
border-radius:10px;
}

.price{
color:#00f5ff;
font-weight:bold;
}

button{
padding:10px;
background:#00f5ff;
border:none;
border-radius:20px;
font-weight:bold;
margin-top:10px;
cursor:pointer;
}
</style>
</head>

<body>

<header>🛒 Modern Ecommerce UI Demo</header>

<div class="container">

<div class="card">
<img src="https://via.placeholder.com/200">
<h3>Product 1</h3>
<p class="price">$29</p>
<button>Buy Now</button>
</div>

<div class="card">
<img src="https://via.placeholder.com/200">
<h3>Product 2</h3>
<p class="price">$49</p>
<button>Buy Now</button>
</div>

<div class="card">
<img src="https://via.placeholder.com/200">
<h3>Product 3</h3>
<p class="price">$99</p>
<button>Buy Now</button>
</div>

</div>

</body>
</html>

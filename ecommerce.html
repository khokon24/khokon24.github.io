<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ecommerce Demo</title>
<style>
body{font-family:Arial;background:#0a0a0a;color:#fff;margin:0}
h1{text-align:center;color:#00f5ff;padding:20px}
.container{display:flex;justify-content:center;flex-wrap:wrap}
.card{background:#1c1c1c;margin:10px;padding:20px;border-radius:10px;width:200px;text-align:center}
button{padding:10px 20px;background:#00f5ff;border:none;border-radius:20px}

</style>
</head>
<body>

<h1>Fashion Store UI</h1>
<div style="text-align:center">
<a href="index.html">Back to Portfolio</a>
</div>

<div class="container">

<div class="card">
<h3>Shirt</h3>
<p>$25</p>
<button>Add to Cart</button>
</div>

<div class="card">
<h3>Shoes</h3>
<p>$50</p>
<button>Add to Cart</button>
</div>

<div class="card">
<h3>Watch</h3>
<p>$80</p>
<button>Add to Cart</button>
</div>

</div>

</body>
</html>

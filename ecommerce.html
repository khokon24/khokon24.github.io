<!DOCTYPE html>
<html>
<head>
<title>Ecommerce Pro | KhokonWeb</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:Poppins;
background:#0a0a0a;
color:white;
}

/* HEADER */
header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px;
background:#111;
}

.logo{
color:#00f5ff;
font-size:22px;
font-weight:bold;
}

.cart{
background:#00f5ff;
color:black;
padding:5px 12px;
border-radius:20px;
font-weight:bold;
}

/* NAV */
nav{
display:flex;
justify-content:center;
gap:25px;
background:#000;
padding:10px;
}

nav a{
color:white;
text-decoration:none;
font-size:14px;
}

/* HERO */
.hero{
text-align:center;
padding:40px;
background:linear-gradient(120deg,#000,#0f2027);
}

.hero h1{
color:#00f5ff;
}

/* PRODUCTS */
.grid{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:20px;
padding:30px;
}

.product{
background:rgba(255,255,255,0.05);
width:220px;
padding:15px;
border-radius:15px;
transition:.3s;
position:relative;
}

.product:hover{
transform:scale(1.05);
box-shadow:0 0 25px #00f5ff;
}

img{
width:100%;
border-radius:10px;
}

.price{
color:#00f5ff;
font-weight:bold;
}

/* BADGE */
.badge{
position:absolute;
top:10px;
left:10px;
padding:5px 10px;
font-size:12px;
border-radius:10px;
background:red;
}

/* BUTTON */
button{
margin-top:10px;
padding:10px;
width:100%;
border:none;
border-radius:20px;
background:#00f5ff;
font-weight:bold;
cursor:pointer;
}

/* FOOTER */
footer{
text-align:center;
padding:20px;
color:#777;
font-size:12px;
}
</style>
</head>

<body>

<header>
<div class="logo">KhokonShop</div>
<div class="cart">Cart: 0</div>
</header>

<nav>
<a href="#">Home</a>
<a href="#">Shop</a>
<a href="#">Deals</a>
<a href="#">Contact</a>
</nav>

<div class="hero">
<h1>🔥 Big Sale Up To 50% Off</h1>
<p>Modern Ecommerce UI built with clean design & real store feel</p>
</div>

<div class="grid">

<div class="product">
<div class="badge">NEW</div>
<img src="https://via.placeholder.com/220">
<h3>Smart Watch</h3>
<p class="price">$49</p>
<button onclick="addToCart()">Add to Cart</button>
</div>

<div class="product">
<div class="badge">HOT</div>
<img src="https://via.placeholder.com/220">
<h3>Headphones</h3>
<p class="price">$79</p>
<button onclick="addToCart()">Add to Cart</button>
</div>

<div class="product">
<div class="badge">SALE</div>
<img src="https://via.placeholder.com/220">
<h3>Running Shoes</h3>
<p class="price">$99</p>
<button onclick="addToCart()">Add to Cart</button>
</div>

</div>

<footer>
© 2026 KhokonWeb | Ecommerce UI Demo
</footer>

<script>
let count = 0;

function addToCart(){
count++;
document.querySelector(".cart").innerText = "Cart: " + count;
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khokon Ahmed | Web Developer</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#000;
color:#fff;
}

/* NAVBAR */
nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 10%;
background:#000;
position:fixed;
width:100%;
top:0;
z-index:1000;
}

nav h2{
color:#00f5ff;
font-weight:800;
}

nav ul{
display:flex;
gap:30px;
list-style:none;
}

nav ul li a{
text-decoration:none;
color:#fff;
transition:0.3s;
}

nav ul li a:hover{
color:#00f5ff;
}

/* HERO */
.hero{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
background:linear-gradient(270deg,#000,#0f2027,#000);
background-size:400% 400%;
animation:bgAnimation 10s ease infinite;
padding:20px;
}

@keyframes bgAnimation{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.hero-content{
margin-top:80px;
}

/* ✅ Profile Image Added */
.profile-img{
width:160px;
height:160px;
border-radius:50%;
object-fit:cover;
margin-bottom:25px;
border:4px solid #00f5ff;
box-shadow:0 0 30px #00f5ff;
}

.hero h1{
font-size:52px;
font-weight:800;
margin-bottom:15px;
}

.hero h1 span{
color:#00f5ff;
text-shadow:0 0 20px #00f5ff;
}

.hero h2{
font-size:28px;
margin-bottom:20px;
color:#aaa;
}

.hero p{
max-width:600px;
margin:0 auto 35px;
color:#ccc;
}

.btn{
padding:15px 40px;
border-radius:50px;
background:#00f5ff;
color:#000;
font-weight:700;
text-decoration:none;
transition:0.3s;
display:inline-block;
}

.btn:hover{
background:#fff;
}

</style>
</head>

<body>

<nav>
<h2>KhokonDev</h2>
<ul>
<li><a href="#">Home</a></li>
<li><a href="#">About</a></li>
<li><a href="#">Projects</a></li>
<li><a href="#">Contact</a></li>
</ul>
</nav>

<section class="hero">
<div class="hero-content">

<!-- ✅ Profile Image -->
<img src="profile.jpg" alt="Khokon Ahmed" class="profile-img">

<h1>Hi, I'm <span>Khokon Ahmed</span></h1>
<h2>Professional Web Developer</h2>
<p>I design and develop modern, responsive and high-converting websites for businesses.</p>

<a href="#" class="btn">Hire Me</a>

</div>
</section>

</body>
</html>

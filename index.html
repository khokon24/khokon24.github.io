<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KhokonDev | Crazy Premium Portfolio</title>

<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>

<header class="nav">
<h2 class="logo">KhokonDev</h2>
<nav>
<a href="#home">Home</a>
<a href="#about">About</a>
<a href="#services">Services</a>
<a href="#work">Work</a>
<a href="#contact">Contact</a>
</nav>
</header>

<!-- HERO -->
<section class="hero">

<div class="glow"></div>
<div class="glow2"></div>

<div class="hero-content">

<div class="badge">🚀 Available for Freelance Work</div>

<h1>Hi, I'm <span>Khokon Ahmed</span></h1>

<h2 class="typing"></h2>

<!-- STATS -->
<div class="stats">

<div class="stat"><span class="counter" data-target="100">0</span>%<p>Fast Delivery</p></div>
<div class="stat"><span class="counter" data-target="100">0</span>%<p>Conversion Focus</p></div>
<div class="stat"><span class="counter" data-target="50">0</span>+<p>Projects</p></div>
<div class="stat"><span class="counter" data-target="20">0</span>+<p>Clients</p></div>

</div>

<div class="cta">
<a href="https://www.fiverr.com/khokondev" class="btn primary">🚀 Hire Me</a>
<a href="#work" class="btn ghost">View Work</a>
</div>

</div>
</section>

<!-- SCRIPT -->
<script>

// Typing Animation
const text = "I build high-converting modern websites that grow your business.";
let i = 0;

function typing(){
if(i < text.length){
document.querySelector(".typing").innerHTML += text.charAt(i);
i++;
setTimeout(typing, 40);
}
}
typing();

// Counter Animation
const counters = document.querySelectorAll('.counter');

const observer = new IntersectionObserver((entries)=>{
entries.forEach(entry=>{
if(entry.isIntersecting){
counters.forEach(counter=>{
const target = +counter.getAttribute('data-target');
let count = 0;

const update = ()=>{
const inc = target / 60;
if(count < target){
count += inc;
counter.innerText = Math.floor(count);
requestAnimationFrame(update);
}else{
counter.innerText = target;
}
};
update();
});
}
});
},{threshold:0.5});

observer.observe(document.querySelector('.stats'));

</script>

</body>
</html>

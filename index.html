<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KhokonDev | Ultimate Portfolio</title>

<style>
body{
margin:0;
font-family:sans-serif;
background:#0b0b0b;
color:white;
}

/* NAV */
.nav{
display:flex;
justify-content:space-between;
padding:15px 30px;
background:#111;
position:sticky;
top:0;
}

/* HERO */
.hero{
text-align:center;
padding:80px 20px;
}
.hero h1 span{
color:#00ffcc;
}

/* BUTTON */
.btn{
padding:10px 15px;
margin:5px;
border:none;
cursor:pointer;
border-radius:6px;
}
.primary{
background:#00ffcc;
color:black;
}

/* SECTION */
.section{
padding:60px 20px;
text-align:center;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
margin-top:20px;
}
.card{
background:#1a1a1a;
padding:15px;
border-radius:10px;
}

/* LOGIN */
.auth{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);
justify-content:center;
align-items:center;
}
.box{
background:#111;
padding:20px;
border-radius:10px;
width:280px;
}

/* DASHBOARD */
.dashboard{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#000;
padding:30px;
}
</style>

</head>

<body>

<header class="nav">
<h2>KhokonDev</h2>
<button onclick="openLogin()" class="btn primary">Login</button>
</header>

<section class="hero">
<h1>Build <span>High Converting Websites</span></h1>
<p>Landing page • Ecommerce • SaaS</p>
<button class="btn primary">Hire Me</button>
</section>

<section class="section">
<h2>Services</h2>
<div class="grid">
<div class="card">Landing Page</div>
<div class="card">Ecommerce</div>
<div class="card">Bug Fix</div>
</div>
</section>

<!-- LOGIN -->
<div class="auth" id="auth">
<div class="box">
<h3>Login</h3>
<input id="u" placeholder="user"><br><br>
<input id="p" type="password" placeholder="pass"><br><br>
<button onclick="login()" class="btn primary">Login</button>
<button onclick="closeLogin()" class="btn">Close</button>
</div>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dash">
<h1>Dashboard</h1>
<p>Welcome to system</p>
<button onclick="logout()" class="btn primary">Logout</button>
</div>

<script>
function openLogin(){
document.getElementById("auth").style.display="flex";
}

function closeLogin(){
document.getElementById("auth").style.display="none";
}

function login(){
let u=document.getElementById("u").value;
let p=document.getElementById("p").value;

if(u==="user" && p==="1234"){
document.getElementById("auth").style.display="none";
document.getElementById("dash").style.display="block";
}else{
alert("Wrong login");
}
}

function logout(){
document.getElementById("dash").style.display="none";
}
</script>

</body>
</html>

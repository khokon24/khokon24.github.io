<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khokon Ahmed | Web Developer</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#000;
color:#fff;
}

/* NAVBAR */
nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 10%;
background:#000;
position:fixed;
width:100%;
top:0;
z-index:1000;
}

nav h2{
color:#00f5ff;
font-weight:800;
}

nav ul{
display:flex;
gap:30px;
list-style:none;
}

nav ul li a{
text-decoration:none;
color:#fff;
transition:0.3s;
}

nav ul li a:hover{
color:#00f5ff;
}

/* HERO SECTION */
.hero{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
background:linear-gradient(270deg,#000,#0f2027,#000);
background-size:400% 400%;
animation:bgAnimation 12s ease infinite;
padding:20px;
}

@keyframes bgAnimation{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.hero-content{
margin-top:80px;
animation:fadeIn 1.5s ease forwards;
opacity:0;
}

@keyframes fadeIn{
to{opacity:1;}
}

/* PROFILE IMAGE */
.profile-img{
width:160px;
height:160px;
border-radius:50%;
object-fit:cover;
margin-bottom:25px;
border:4px solid #00f5ff;
box-shadow:0 0 30px #00f5ff;
}

/* TITLE */
.hero-title{
font-size:52px;
font-weight:800;
margin-bottom:15px;
line-height:1.2;
}

.hello{
font-size:32px;
font-weight:400;
color:#fff;
animation:fadeHello 1.2s ease forwards;
opacity:0;
}

@keyframes fadeHello{
to{opacity:1;}
}

.name{
color:#00f5ff;
text-shadow:0 0 20px #00f5ff;
animation:glow 2s infinite alternate;
}

@keyframes glow{
from{ text-shadow:0 0 10px #00f5ff; }
to{ text-shadow:0 0 30px #00f5ff; }
}

.hero h2{
font-size:26px;
margin-bottom:20px;
color:#aaa;
}

.hero p{
max-width:600px;
margin:0 auto 35px;
color:#ccc;
}

/* BUTTON */
.btn{
padding:16px 45px;
border-radius:50px;
background:#00f5ff;
color:#000;
font-weight:700;
text-decoration:none;
transition:0.3s;
display:inline-block;
box-shadow:0 0 20px #00f5ff;
}

.btn:hover{
background:#fff;
transform:scale(1.05);
}

/* MOBILE */
@media(max-width:768px){

nav{
flex-direction:column;
gap:15px;
}

.hero-title{
font-size:38px;
}

.hello{
font-size:24px;
}

.profile-img{
width:130px;
height:130px;
}

}

</style>
</head>

<body>

<nav>
<h2>KhokonDev</h2>
<ul>
<li><a href="#">Home</a></li>
<li><a href="#">About</a></li>
<li><a href="#">Services</a></li>
<li><a href="#">Projects</a></li>
<li><a href="#">Contact</a></li>
</ul>
</nav>

<section class="hero">
<div class="hero-content">

<img src="profile.jpg" alt="Khokon Ahmed" class="profile-img">

<h1 class="hero-title">
<span class="hello">Hello,</span><br>
I'm <span class="name">Khokon Ahmed</span>
</h1>

<h2>Professional Web Designer & Frontend Developer</h2>

<p>I build modern, responsive & high-converting websites for businesses and startups.</p>

<a href="#" class="btn">Hire Me on Fiverr</a>

</div>
</section>

</body>
</html>

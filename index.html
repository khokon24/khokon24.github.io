<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KhokonDev | Ultimate SaaS Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

/* RESET */
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{background:#050505;color:#fff;overflow-x:hidden;}

/* NAV */
.nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 50px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(10px);
position:sticky;
top:0;
}
.nav a{color:#fff;text-decoration:none;margin:0 10px;opacity:0.7;}
.nav a:hover{color:#00ffcc;}

/* HERO */
.hero{text-align:center;padding:120px 20px;}
.hero h1{font-size:48px;}
.hero span{color:#00ffcc;}
.hero p{opacity:0.7;margin-top:10px;}

.btn{
padding:12px 20px;
margin:10px;
border-radius:8px;
border:none;
cursor:pointer;
font-weight:600;
}
.primary{background:#00ffcc;color:#000;}
.outline{border:2px solid #00ffcc;color:#00ffcc;background:none;}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
padding:40px;
}
.card{
background:#111;
padding:20px;
border-radius:10px;
text-align:center;
}

/* SECTION */
.section{text-align:center;padding:80px 20px;}
.dark{background:#111;}

/* LOGIN */
.auth{
display:none;
justify-content:center;
align-items:center;
height:100vh;
}
.form{
background:#111;
padding:30px;
border-radius:10px;
width:300px;
}
input{
width:100%;
padding:10px;
margin:10px 0;
border:none;
border-radius:6px;
}

/* DASHBOARD */
.dashboard{display:none;padding:40px;}

/* STICKY CTA */
.sticky{
position:fixed;
bottom:15px;
left:50%;
transform:translateX(-50%);
background:#00ffcc;
color:#000;
padding:10px 20px;
border-radius:50px;
font-weight:600;
}

</style>
</head>

<body>

<!-- NAV -->
<header class="nav">
<h2>KhokonDev</h2>
<div>
<a href="#">Home</a>
<a href="#">Services</a>
<a href="#" onclick="showLogin()">SaaS</a>
</div>
</header>

<!-- HERO -->
<section class="hero">
<h1>I Build <span>High-Converting Systems</span></h1>
<p>Landing pages, ecommerce & SaaS dashboard</p>

<button class="btn primary" onclick="showLogin()">Open SaaS Demo</button>
</section>

<!-- SERVICES -->
<section class="section">
<h2>Services</h2>

<div class="grid">
<div class="card">Landing Page</div>
<div class="card">Ecommerce UI</div>
<div class="card">SaaS Dashboard</div>
</div>
</section>

<!-- LOGIN -->
<section class="auth" id="authBox">
<div class="form">
<h2>Login</h2>
<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Password">
<button class="btn primary" onclick="login()">Login</button>
<p>Demo: user / 1234</p>
</div>
</section>

<!-- DASHBOARD -->
<section class="dashboard" id="dashboard">
<h1>Dashboard</h1>

<div class="grid">
<div class="card">Users: 120</div>
<div class="card">Orders: 54</div>
<div class="card">Revenue: $2400</div>
</div>

<button class="btn primary" onclick="logout()">Logout</button>
</section>

<!-- STICKY CTA -->
<div class="sticky">
🚀 Need Website? Hire Me
</div>

<script>

/* SHOW LOGIN */
function showLogin(){
document.querySelector(".hero").style.display="none";
document.querySelector(".section").style.display="none";
document.getElementById("authBox").style.display="flex";
}

/* LOGIN SYSTEM */
function login(){
let u=document.getElementById("user").value;
let p=document.getElementById("pass").value;

if(u==="user" && p==="1234"){
localStorage.setItem("auth","1");
showDashboard();
}else{
alert("Wrong credentials");
}
}

/* DASHBOARD */
function showDashboard(){
document.getElementById("authBox").style.display="none";
document.getElementById("dashboard").style.display="block";
}

/* AUTO LOGIN */
if(localStorage.getItem("auth")){
showDashboard();
}

/* LOGOUT */
function logout(){
localStorage.removeItem("auth");
location.reload();
}

</script>

</body>
</html>
